[project]
name = "doc-type-recognition"
version = "0.1.0"
description = "Document typing for specialty insurance submissions with Laya, a confidence gate, an LLM fallback and a label store"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
laya = ["laya>=0.4.15"]
bedrock = ["boto3>=1.43"]
dev = ["pytest>=9"]

[project.scripts]
doctype = "doctype.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doctype"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
